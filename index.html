*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:46px}

.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--mut);font-size:14px}
.q{font-size:17px;font-weight:600;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;line-height:1.4}

.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.exp{background:var(--acc2);border-radius:12px;padding:12px;margin:12px 0;font-size:15px}
.tag{display:inline-block;font-size:12px;background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 8px;margin-right:6px}
.num{display:inline-block;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;text-align:center;font-size:13px;line-height:22px;margin-right:8px}
details{border-top:1px solid var(--line);padding:8px 0}
summary{font-weight:600;cursor:pointer;padding:6px 0}
ul{margin:6px 0 6px 18px;padding:0}
li{margin:4px 0}
.big{font-size:40px;font-weight:700;color:var(--acc);margin:4px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}
.foot{color:var(--mut);font-size:12px;margin-top:22px}
</style>

[24,"met","Последовательность логопедической работы при тахилалии","4 → 2 → 5 → 1 → 3 (режим молчания → медленный темп → адекватность фразы и редактирование → коллективный рассказ → подготовка к публичному выступлению)","От ограничения речи и замедления темпа к осмысленности высказываний, затем к коллективной и публичной речи."],
[25,"met","Что НЕ относится к закреплению фонематического анализа","Списать текст","Списывание — зрительно-моторная работа. Остальные варианты опираются на анализ звукового состава слова."]
];
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.q=S.q||{};S.exam=S.exam||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rec(id,ok){const r=S.q[id]||(S.q[id]={ok:0,bad:0});ok?r.ok++:r.bad++;r.last=ok;save()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=document.getElementById("app");
let st=null,tick=null;
function stop(){if(tick){clearInterval(tick);tick=null}}
function ids(t){return Q.map((q,i)=>i).filter(i=>!t||Q[i][0]===t)}
function mastered(t){return ids(t).filter(i=>S.q[i]&&S.q[i].last).length}
function weak(){return ids().filter(i=>S.q[i]&&S.q[i].last===false)}

function home(){
 stop();st=null;
 const all=ids().length,m=mastered(),w=weak().length;
 let h=`<h1>Подготовка к диагностике МЦКО</h1><p class="sub">Учитель-логопед. Тренировка по темам, пробный экзамен и работа над ошибками.</p>
 <div class="card"><div class="top"><span>Освоено вопросов</span><b>${m} из ${all}</b></div><div class="bar"><i style="width:${all?m/all*100:0}%"></i></div>
 <div class="row"><button class="p" onclick="startMix()">Тренировка с разбором</button><button onclick="startWeak()" ${w?"":"disabled"}>Мои ошибки (${w})</button><button onclick="glossary()">Словарь терминов</button><button onclick="demo()">Разбор демоверсии</button></div><p class="sub" style="margin:10px 0 0">После каждого ответа сразу видно, верно или нет, и почему.</p></div>
 <h2>По темам</h2>`;
 for(const t in TOPICS){const n=ids(t).length,k=mastered(t);
  h+=`<div class="card"><b>${TOPICS[t]}</b><div class="top"><span>${k} из ${n}</span></div><div class="bar"><i style="width:${k/n*100}%"></i></div>
  <div class="row"><button class="p" onclick="startTopic('${t}')">Тренировка</button><button onclick="cheat('${t}')">Шпаргалка</button></div></div>`}
 h+=`<h2>Проверка перед сдачей</h2><div class="card"><p class="sub" style="margin:0 0 10px">По желанию, когда мама уже подготовилась: 25 вопросов как на экзамене. Подсказок нет, разбор в конце.</p><div class="row"><button onclick="startExam(false)">Без таймера</button><button onclick="startExam(true)">С таймером 45 минут</button></div></div>`;
 if(window.askReset)h+=`<div class="card"><b>Сбросить весь прогресс?</b><div class="row" style="margin-top:8px"><button class="p" onclick="doReset()">Да, сбросить</button><button onclick="window.askReset=false;home()">Отмена</button></div></div>`;
 h+=`<div class="row" style="margin-top:14px"><button class="g" onclick="reset()">Сбросить прогресс</button></div>
 <p class="foot">Вопросы составлены для самоподготовки по темам демоверсии и не являются вопросами экзамена. Фактический материал стоит сверить с учебными источниками и актуальными нормативными документами.</p>`;
 $.innerHTML=h;window.scrollTo(0,0);
}
function glossary(){stop();st=null;
 $.innerHTML=`<div class="top"><button class="g" onclick="home()">← Назад</button></div><h1>Словарь терминов</h1><p class="sub">Начните вводить термин или слово из определения.</p><input id="gq" type="search" placeholder="Поиск" oninput="fillGl(this.value)" style="width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)"><div id="gl"></div>`;fillGl("");window.scrollTo(0,0)}
function fillGl(q){q=q.trim().toLowerCase();const r=GL.filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));document.getElementById("gl").innerHTML=r.length?r.map(x=>`<div class="card"><b>${x[0]}</b><div style="margin-top:4px">${x[1]}</div></div>`).join(""):`<p class="sub">Ничего не найдено.</p>`}
function demo(){stop();st=null;
 $.innerHTML=`<div class="top"><button class="g" onclick="home()">← Назад</button></div><h1>Разбор демоверсии</h1><p class="sub">Демоверсия МЦКО для учителей-логопедов: 25 заданий. Здесь краткая суть каждого задания, правильный ответ и разбор. Полные формулировки смотрите в PDF демоверсии.</p>`+
 DEMO.map(x=>`<div class="card"><details><summary><span class="tag">${TOPICS[x[1]]}</span>№${x[0]}. ${x[2]}</summary><div class="exp"><b>Верно:</b> ${x[3]}<br><br>${x[4]}</div></details></div>`).join("");window.scrollTo(0,0)}
function cheat(t){
 stop();
 $.innerHTML=`<div class="top"><button class="g" onclick="home()">← Назад</button></div><h1>${TOPICS[t]}</h1><p class="sub">Шпаргалка</p>`+
 `<div class="card">`+CHEAT[t].map((s,i)=>`<details ${i==0?"open":""}><summary>${s[0]}</summary><ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("")+`</div><div class="row"><button class="p" onclick="startTopic('${t}')">Проверить себя</button></div>`;
 window.scrollTo(0,0);
}
function reset(){window.askReset=true;home()}
function doReset(){window.askReset=false;S={q:{},exam:[]};save();home()}

function begin(list,mode,title,timed){stop();st={list,i:0,mode,title,views:{},done:{},ans:{},timed:!!timed};if(mode==="exam"&&timed){st.end=Date.now()+45*60000;tick=setInterval(()=>{const l=st.end-Date.now();if(l<=0){finish();return}const e=document.getElementById("tm");if(e){e.textContent=fmt(l);e.className="timer"+(l<300000?" low":"")}},1000)}render()}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTopic(t){begin(shuffle(ids(t)),"practice",TOPICS[t])}
function startMix(){const a=ids(),w=shuffle(a.filter(i=>S.q[i]&&S.q[i].last===false)),u=shuffle(a.filter(i=>!S.q[i])),r=shuffle(a.filter(i=>S.q[i]&&S.q[i].last));begin(w.concat(u,r).slice(0,20),"practice","Умная тренировка")}
function startWeak(){begin(shuffle(weak()),"practice","Работа над ошибками")}
function startExam(timed){const quota={law:5,psy:6,log:10,met:4};let l=[];for(const t in quota)l=l.concat(shuffle(ids(t)).slice(0,quota[t]));begin(l,"exam","Проверка перед сдачей",timed)}
function view(id){if(!st.views[id]){const d=Q[id];st.views[id]=d[3]===-1?{seq:true,items:shuffle(d[2].map((t,p)=>({t,p}))),pick:[]}:{seq:false,opts:shuffle(d[2].map((t,i)=>({t,ok:i===d[3]}))),sel:null}}return st.views[id]}
function isOk(id){const v=view(id);if(v.seq)return v.pick.length===v.items.length&&v.pick.every((x,k)=>v.items[x].p===k);return v.sel!==null&&v.opts[v.sel].ok}
function render(){
 const id=st.list[st.i],d=Q[id],v=view(id),ex=st.mode==="exam",locked=!ex&&st.done[id];
 const n=st.list.length,last=st.i===n-1;
 let h=`<div class="top"><button class="g" onclick="${ex?"askExit()":"home()"}">← Выйти</button><span>${st.i+1} / ${n}</span>${ex&&st.timed?`<span id="tm" class="timer">${fmt(st.end-Date.now())}</span>`:"<span></span>"}</div>${st.ask?`<div class="card"><b>Выйти из проверки?</b><div class="row" style="margin-top:8px"><button class="p" onclick="finish()">Показать результат</button><button onclick="home()">Выйти без результата</button><button onclick="st.ask=false;render()">Продолжить</button></div></div>`:""}
 <div class="bar"><i style="width:${(st.i)/n*100}%"></i></div>
 <div class="card"><span class="tag">${TOPICS[d[0]]}</span><div class="q">${d[1]}</div>`;
 if(v.seq){
  h+=`<p class="sub">Нажимайте варианты в нужном порядке. Нажмите на выбранный, чтобы убрать его.</p>`;
  v.items.forEach((it,k)=>{const pos=v.pick.indexOf(k);let c="opt";
   if(locked){c+=it.p===v.pick.indexOf(k)&&pos>=0?" ok":" bad"}else if(pos>=0)c+=" sel";
   h+=`<button class="${c}" ${locked?"disabled":""} onclick="pickSeq(${k})">${pos>=0?`<span class="num">${pos+1}</span>`:""}${it.t}</button>`});
  if(!locked)h+=`<div class="row"><button onclick="resetSeq()">Сбросить</button>${ex?"":`<button class="p" onclick="check()" ${v.pick.length===v.items.length?"":"disabled"}>Проверить</button>`}</div>`;
 }else{
  v.opts.forEach((o,k)=>{let c="opt";if(locked){if(o.ok)c+=" ok";else if(v.sel===k)c+=" bad"}else if(v.sel===k)c+=" sel";
   h+=`<button class="${c}" ${locked?"disabled":""} onclick="pick(${k})">${o.t}</button>`});
 }
 if(locked){const ok=isOk(id);h+=`<div class="exp"><b>${ok?"Верно.":"Неверно."}</b> ${ok?"":"Правильно: "+ansText(d)+". "}${d[4]}</div>`}
 h+=`</div><div class="row">`;
 if(ex&&st.i>0)h+=`<button onclick="prev()">← Назад</button>`;
 if(ex||locked)h+=`<button class="p" onclick="${last?"finish()":"next()"}">${last?"Завершить":"Дальше"}</button>`;
 h+=`</div>`;
 $.innerHTML=h;
}
function ansText(d){return d[3]===-1?d[2].join(" → "):d[2][d[3]]}
function pick(k){const id=st.list[st.i],v=view(id);if(st.mode!=="exam"){if(st.done[id])return;v.sel=k;st.done[id]=true;rec(id,isOk(id))}else v.sel=k;render()}
function pickSeq(k){const id=st.list[st.i],v=view(id);if(st.done[id]&&st.mode!=="exam")return;const p=v.pick.indexOf(k);if(p>=0)v.pick.splice(p,1);else v.pick.push(k);render()}
function resetSeq(){view(st.list[st.i]).pick=[];render()}
function check(){const id=st.list[st.i];st.done[id]=true;rec(id,isOk(id));render()}
function askExit(){st.ask=true;render()}
function prev(){st.i--;render();window.scrollTo(0,0)}
function next(){st.i++;render();window.scrollTo(0,0)}
function finish(){
 stop();const ex=st.mode==="exam";let ok=0;const by={};const wrong=[];
 st.list.forEach(id=>{const o=isOk(id);if(o)ok++;else wrong.push(id);const t=Q[id][0];by[t]=by[t]||[0,0];by[t][1]++;if(o)by[t][0]++;if(ex)rec(id,o)});
 const n=st.list.length;
 if(ex){S.exam.push({d:new Date().toLocaleDateString("ru-RU"),s:ok,n});save()}
 let h=`<h1>${st.title}</h1><div class="card"><div class="big">${ok} из ${n}</div><div class="bar"><i style="width:${n?ok/n*100:0}%"></i></div>`+
 Object.keys(by).map(t=>`<div class="top"><span>${TOPICS[t]}</span><b>${by[t][0]} из ${by[t][1]}</b></div>`).join("")+`</div>`;
 if(wrong.length){h+=`<h2>Разбор ошибок</h2>`+wrong.map(id=>{const d=Q[id];return `<div class="card"><div class="q">${d[1]}</div><div class="exp"><b>Правильно:</b> ${ansText(d)}<br>${d[4]}</div></div>`}).join("")}
 h+=`<div class="row"><button class="p" onclick="home()">На главную</button></div>`;
 st=null;$.innerHTML=h;window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
